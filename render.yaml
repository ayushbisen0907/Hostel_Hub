# Render Blueprint — deploys the API and the website together.
# Render dashboard → New → Blueprint → pick this repo. You'll be asked for the
# values marked `sync: false` (MONGODB_URI). Everything else is filled in here.

services:
  # ---------------- API (Node + Express) ----------------
  - type: web
    name: hostelhub-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI # paste your Atlas connection string (database name: hostelhub)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN # the website's host, filled in by Render (add a custom domain here comma-separated if needed)
        fromService:
          type: web
          name: hostelhub-web
          property: host
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: '5'
      - key: MONGOMS_DISABLE_POSTINSTALL # tests-only in-memory MongoDB: don't download it on Render
        value: '1'

  # ---------------- Website (React, static) ----------------
  - type: web
    name: hostelhub-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL # the API's host, filled in by Render; the app calls https://<host>/api
        fromService:
          type: web
          name: hostelhub-api
          property: host
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD # e2e tests only
        value: '1'
    routes:
      # single-page app: every path is served by index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
